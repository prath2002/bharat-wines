[project]
name = "bharat_wines_backend"
version = "0.1.0"
description = "Backend for Bharat Wines Liquor Inventory & SCM Automation Platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic[email]",
    "pydantic-settings",
    "alembic",
    "celery",
    "redis",
    "boto3",
    "bcrypt",
    "pyjwt",
    "python-multipart",
    "rapidfuzz",
    "pandas",
    "openpyxl",
    "openai>=1.50.0",
    "httpx<0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx<0.28.0",
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
