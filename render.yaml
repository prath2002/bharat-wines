services:
  # Managed Redis Cache/Broker
  - type: keyvalue
    name: bharat-wines-redis
    plan: free
    ipAllowList: []

  # Backend FastAPI Web Service (Now also runs the Celery Worker)
  - type: web
    name: bharat-wines-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "bash start.sh"
    envVars:
      - key: APP_ENV
        value: prod
      # Add placeholder for Supabase Connection String
      - key: DATABASE_URL
        value: placeholder-update-with-supabase-url-in-dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must be the exact production frontend origin(s) (comma-separated, no
      # trailing slash) -- required for the cookie-based refresh token to work
      # cross-site, e.g. https://bharat-wines.vercel.app
      - key: CORS_ORIGINS
        value: placeholder-update-with-frontend-url-in-dashboard
      # AI Providers
      - key: OCR_PROVIDER
        value: vision
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_API_KEY
        value: placeholder-update-in-dashboard
