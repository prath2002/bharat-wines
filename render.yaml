services:
  # Managed Redis Cache/Broker (now uses keyvalue syntax)
  - type: keyvalue
    name: bharat-wines-redis
    plan: starter
    ipAllowList: []

  # Backend FastAPI Web Service
  - type: web
    name: bharat-wines-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: APP_ENV
        value: prod
      # Add placeholder for Supabase Connection String
      - key: DATABASE_URL
        value: placeholder-update-with-supabase-url-in-dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add placeholder for OPENAI_API_KEY
      - key: OPENAI_API_KEY
        value: placeholder-update-in-dashboard

  # Background Celery Worker
  - type: worker
    name: bharat-wines-worker
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "celery -A app.workers.celery_app worker --loglevel=info"
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromService:
          type: web
          name: bharat-wines-backend
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: bharat-wines-backend
          envVarKey: JWT_SECRET
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: bharat-wines-backend
          envVarKey: OPENAI_API_KEY
