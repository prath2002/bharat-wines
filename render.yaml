services:
  # Managed Redis Cache/Broker
  - type: keyvalue
    name: bharat-wines-redis
    plan: free
    ipAllowList: []

  # Backend FastAPI Web Service (Now also runs the Celery Worker)
  - type: web
    name: bharat-wines-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "bash start.sh"
    envVars:
      - key: APP_ENV
        value: prod
      # Add placeholder for Supabase Connection String
      - key: DATABASE_URL
        value: placeholder-update-with-supabase-url-in-dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: bharat-wines-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add placeholder for OPENAI_API_KEY
      - key: OPENAI_API_KEY
        value: placeholder-update-in-dashboard
